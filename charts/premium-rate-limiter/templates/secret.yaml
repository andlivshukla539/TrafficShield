apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  jwt-secret: {{ .Values.auth.jwtSecret | b64enc | quote }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.password }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}
